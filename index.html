
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WILDS COMPENDIUM Prototype</title>
<style>
:root{--bg:#1f2123;--panel:#2b2d2f;--line:#555;--gold:#c2a06a;--text:#ece7dd;--muted:#a9a49b}
[data-theme=light]{--bg:#f4f0e8;--panel:#fff;--line:#d7d0c4;--gold:#8e7044;--text:#222;--muted:#666}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Noto Sans JP",sans-serif}
header{padding:16px;background:#242628;border-bottom:1px solid var(--line);position:sticky;top:0}
[data-theme=light] header{background:#fff}
.top{display:flex;justify-content:space-between;align-items:center}
button{background:#3a3d40;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
button.primary{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700}
main{max-width:900px;margin:auto;padding:14px}
.series{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:16px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.item{display:flex;flex-direction:column;align-items:center;gap:6px}
.icon{aspect-ratio:1;border:2px solid #6f6f6f;border-radius:12px;width:100%;display:grid;place-items:center;background:#181818;transition:.2s}
.icon.done{background:#565b57;border-color:#d5c8a5;filter:none}
.icon.todo{filter:brightness(.45)}
.part{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.big{font-size:24px;color:var(--gold);font-weight:700}
@media(max-width:560px){.grid{gap:8px}}
</style>
</head>
<body>
<header><div class="top"><div><div style="font-size:18px;font-weight:700">WILDS COMPENDIUM</div><div style="font-size:11px;color:var(--gold)">ARMOR & MATERIALS</div></div><button id="theme">â˜¾ ãƒ€ãƒ¼ã‚¯</button></div></header>
<main>
<div class="stats">
<div class="card"><div class="big" id="crafted">0</div>ä½œè£½æ¸ˆã¿</div>
<div class="card"><div class="big" id="remain">20</div>æœªä½œè£½</div>
<div class="card"><div class="big" id="rate">0%</div>é€²æ—</div>
</div>
<div id="list"></div>
</main>
<script>
const KEY='wilds_proto_v1';
const base=[
 {name:'ãƒœãƒ¼ãƒ³Î±',parts:['é ­','èƒ´','è…•','è…°','è„š']},
 {name:'ãƒœãƒ¼ãƒ³Î²',parts:['é ­','èƒ´','è…•','è…°','è„š']},
 {name:'ã‚¢ãƒ­ã‚¤Î±',parts:['é ­','èƒ´','è…•','è…°','è„š']},
 {name:'ã‚¢ãƒ­ã‚¤Î²',parts:['é ­','èƒ´','è…•','è…°','è„š']}
];
let state=JSON.parse(localStorage.getItem(KEY)||'{}');
state.done=state.done||{};
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function render(){
 let total=0,done=0;
 const root=document.getElementById('list');root.innerHTML='';
 base.forEach((s,si)=>{
  const box=document.createElement('div');box.className='series';
  box.innerHTML=`<div class="head"><div><b>${s.name}</b></div><div style="color:var(--gold)">${s.parts.filter((_,i)=>state.done[si+'-'+i]).length}/${s.parts.length}</div></div>`;
  const g=document.createElement('div');g.className='grid';
  s.parts.forEach((p,pi)=>{
   total++;
   const id=si+'-'+pi;
   if(state.done[id])done++;
   const cell=document.createElement('div');cell.className='item';
   cell.innerHTML=`<button class="icon ${state.done[id]?'done':'todo'}" data-id="${id}" style="padding:0"><div style="font-size:38px">ðŸ›¡ï¸</div></button><div class="part">${p}</div>`;
   g.appendChild(cell);
  });
  box.appendChild(g);root.appendChild(box);
 });
 document.querySelectorAll('.icon').forEach(b=>b.onclick=()=>{const id=b.dataset.id;state.done[id]=!state.done[id];save();});
 document.getElementById('crafted').textContent=done;
 document.getElementById('remain').textContent=total-done;
 document.getElementById('rate').textContent=Math.round(done/total*100)+'%';
}
const tkey='wilds_theme';
function theme(t){document.documentElement.dataset.theme=t;localStorage.setItem(tkey,t);document.getElementById('theme').textContent=t==='dark'?'â˜¾ ãƒ€ãƒ¼ã‚¯':'â˜€ ãƒ©ã‚¤ãƒˆ'}
theme(localStorage.getItem(tkey)||'dark');
document.getElementById('theme').onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');
render();
</script>
</body>
</html>
